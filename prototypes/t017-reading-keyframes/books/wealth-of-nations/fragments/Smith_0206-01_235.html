<p class="indent-no" id="Smith_0206-01_235">THE greatest improvement<a href="#lf0206-01_footnote_nt114" id="lf0206-01_footnote_nt114_ref" class="footnote-link type-footnote">2</a> in the productive powers of labour,<span class="type-margin"><span>Division of labour is the great cause of its increased powers,</span></span> and the greater part of the skill, dexterity, and judgment with which it is any where directed, or applied, seem to have been the effects of the division of labour.</p>
